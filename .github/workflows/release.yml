# Push a tag vX.Y.Z (matching package.json's version) to release:
# - npm: staged publish over OIDC trusted publishing (provenance, no token stored). The version
#   goes live only after a maintainer approves it with 2FA (npmjs.com, Staged Packages tab, or
#   `npm stage approve <id>`).
# - GitHub: a release carrying dsh-tabs.tgz, the tarball the plugin registry installs from.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write   # create the release
  id-token: write   # npm trusted publishing

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      - name: Tag matches package.json
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - run: npm run check
      - run: npm test
      - name: npm stage publish (skipped when this version is already on npm)
        run: |
          if npm view "$(node -p 'require("./package.json").name')@$(node -p 'require("./package.json").version')" version >/dev/null 2>&1; then
            echo "already on npm, skipping"
          else
            npm stage publish
          fi
      - name: GitHub release with dsh-tabs.tgz
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mv "$(npm pack --silent)" dsh-tabs.tgz
          gh release create "$GITHUB_REF_NAME" dsh-tabs.tgz --title "$GITHUB_REF_NAME" --generate-notes
